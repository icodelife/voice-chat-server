name: Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      fresh_install:
        description: '全新安装（会创建新的 SFU App）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'worker.ts'
      - 'wrangler.jsonc'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Detect Account ID
        id: account
        run: |
          # 从 token 自动获取账号 ID（建 token 时勾选你授权的账户）
          RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")
          ACCOUNT_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "账号 ID: $ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create SFU App (fresh install only)
        if: github.event.inputs.fresh_install == 'true'
        id: sfu
        run: |
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"voice-chat-server"}' \
            "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.id }}/calls/apps")
          echo "app_id=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['uid'])")" >> $GITHUB_OUTPUT
          echo "app_secret=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['secret'])")" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: |
          # ALLOW_PASSWORD_ROOMS: 可选的 GitHub Variables，不设置则默认为 true（允许密码房）
          # 需要关闭时，在仓库 Settings → Variables 中设置 ALLOW_PASSWORD_ROOMS=false
          EXTRA_VARS=""
          if [ -n "${{ vars.ALLOW_PASSWORD_ROOMS }}" ]; then
            EXTRA_VARS="--var ALLOW_PASSWORD_ROOMS:${{ vars.ALLOW_PASSWORD_ROOMS }}"
          fi
          if [ "${{ github.event.inputs.fresh_install }}" == "true" ]; then
            wrangler deploy --var "SFU_APP_ID:${{ steps.sfu.outputs.app_id }}" $EXTRA_VARS
          else
            wrangler deploy --var "SFU_APP_ID:${{ secrets.SFU_APP_ID }}" $EXTRA_VARS
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}

      - name: Set SFU Secret (fresh install only)
        if: github.event.inputs.fresh_install == 'true'
        run: |
          printf '%s' '${{ steps.sfu.outputs.app_secret }}' | wrangler secret put SFU_APP_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}

      - name: Enable workers.dev
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.id }}/workers/scripts/voice-chat-server/subdomain"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Output SFU credentials (fresh install only)
        if: github.event.inputs.fresh_install == 'true'
        run: |
          echo "::warning::新的 SFU App 已创建，请保存以下信息到 GitHub Secrets："
          echo "::warning::SFU_APP_ID=${{ steps.sfu.outputs.app_id }}"
          echo "::warning::SFU_APP_SECRET=(已自动设置)"
